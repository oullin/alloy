name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      go_changed: ${{ steps.detect.outputs.go_changed }}
      ts_changed: ${{ steps.detect.outputs.ts_changed }}
      browser_changed: ${{ steps.detect.outputs.browser_changed }}
      has_special_label: ${{ steps.detect.outputs.has_special_label }}
      has_coverage_label: ${{ steps.detect.outputs.has_coverage_label }}
      has_e2e_label: ${{ steps.detect.outputs.has_e2e_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed surfaces
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/changed-files.txt"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "${changed_files}"

          labels="$(jq -r '.pull_request.labels[].name' "${GITHUB_EVENT_PATH}")"
          has_coverage_label=false
          has_e2e_label=false

          if grep -Fxq 'coverage-all' <<< "${labels}"; then
            has_coverage_label=true
          fi

          if grep -Eq '^e2e-' <<< "${labels}"; then
            has_e2e_label=true
          fi

          has_special_label=false
          if [[ "${has_coverage_label}" == "true" || "${has_e2e_label}" == "true" ]]; then
            has_special_label=true
          fi

          go_changed=false
          ts_changed=false
          browser_changed=false

          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue

            case "${file}" in
              go/*|go.work|go.work.example|.github/actions/setup/*|.github/workflows/ci.yml|.github/workflows/ci-go.yml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|vite.config.ts|.npmrc|infra/scripts/tasks/go-test.sh|infra/scripts/tasks/cache-env.sh)
                go_changed=true
                ;;
            esac

            case "${file}" in
              ts/*|infra/*|packages/*|web/*|.github/actions/setup/*|.github/workflows/ci.yml|.github/workflows/ci-ts.yml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|vite.config.ts|tsconfig.json|.npmrc)
                ts_changed=true
                ;;
            esac
          done < "${changed_files}"

          {
            echo "go_changed=${go_changed}"
            echo "ts_changed=${ts_changed}"
            echo "browser_changed=${browser_changed}"
            echo "has_special_label=${has_special_label}"
            echo "has_coverage_label=${has_coverage_label}"
            echo "has_e2e_label=${has_e2e_label}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### CI selection"
            echo "- Go changed: ${go_changed}"
            echo "- TypeScript changed: ${ts_changed}"
            echo "- Browser/E2E changed: ${browser_changed}"
            echo "- coverage-all label: ${has_coverage_label}"
            echo "- e2e-* label: ${has_e2e_label}"
          } >> "${GITHUB_STEP_SUMMARY}"

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          go-version: "1.26.4"

      - name: Go tests
        run: pnpm exec vp run go:test

  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.ts_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check package imports
        run: pnpm imports:check

      - name: Typecheck
        run: pnpm exec vp check

      - name: Tests
        run: pnpm exec vp test

      - name: Pack
        run: pnpm exec vp pack

  label_requests:
    name: Label requests
    needs: changes
    if: needs.changes.outputs.has_special_label == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain label handling
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Label-triggered checks"
            if [[ "${{ needs.changes.outputs.has_coverage_label }}" == "true" ]]; then
              echo "- coverage-all was requested, but Alloy does not have coverage scripts wired into CI yet."
            fi
            if [[ "${{ needs.changes.outputs.has_e2e_label }}" == "true" ]]; then
              echo "- e2e-* was requested, but Alloy does not have a stable E2E workflow wired into CI yet."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  noop:
    name: No selected checks
    needs: changes
    if: needs.changes.outputs.go_changed != 'true' && needs.changes.outputs.ts_changed != 'true' && needs.changes.outputs.has_special_label != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo "No Go, TypeScript, coverage, or E2E checks were selected for this PR update."
