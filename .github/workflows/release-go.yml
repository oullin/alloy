name: Go Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.1.
        required: true
        type: string
  push:
    tags:
      - go/v*

permissions:
  contents: write

concurrency:
  group: release-go-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          go-version: "1.26.4"

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_NAMESPACE: go
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: bash infra/scripts/tasks/resolve-release-tag.sh

      - run: pnpm exec vp run go:test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "${TAG}"
            --title "Go ${VERSION}"
            --notes "Go module release ${VERSION}."
          )

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            args+=(--target "${GITHUB_SHA}")
          fi

          gh release create "${args[@]}"
