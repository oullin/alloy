name: Go Release

'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.1.
        required: true
        type: string
  push:
    tags:
      - go/v*

permissions:
  contents: write

concurrency:
  group: release-go-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          go-version: "1.26.4"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"

            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must match X.Y.Z, got: ${version}" >&2
              exit 1
            fi

            tag="go/v${version}"

            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "tag already exists: ${tag}" >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#go/v}"

            if [[ "${tag}" == "${version}" || ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "expected a go/vX.Y.Z tag, got: ${tag}" >&2
              exit 1
            fi
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - run: pnpm exec vp run go:test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "${TAG}"
            --title "Go ${VERSION}"
            --notes "Go module release ${VERSION}."
          )

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            args+=(--target "${GITHUB_SHA}")
          fi

          gh release create "${args[@]}"
