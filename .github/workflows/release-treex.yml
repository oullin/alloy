name: treex Release

# treex is the only binary this repository distributes, so it gets its own tag
# train rather than riding the go/v* one: the CLI and the alloy library have no
# reason to share a version number.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.0.
        required: true
        type: string
  push:
    tags:
      - treex/v*

permissions:
  contents: write
  packages: write

concurrency:
  group: release-treex-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          go-version: "1.26.6"

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_NAMESPACE: treex
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: bash infra/scripts/tasks/resolve-release-tag.sh

      - run: pnpm exec vp run go:test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "${TAG}"
            --title "treex ${VERSION}"
            --generate-notes
          )

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            args+=(--target "${GITHUB_SHA}")
          fi

          gh release create "${args[@]}"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # goreleaser only attaches assets; the release itself was created above so
      # that it carries GitHub's generated notes.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
