name: TypeScript Release

'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.1.
        required: true
        type: string
  push:
    tags:
      - ts/v*

permissions:
  contents: write

concurrency:
  group: release-ts-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"

            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must match X.Y.Z, got: ${version}" >&2
              exit 1
            fi

            tag="ts/v${version}"

            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "tag already exists: ${tag}" >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#ts/v}"

            if [[ "${tag}" == "${version}" || ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "expected a ts/vX.Y.Z tag, got: ${tag}" >&2
              exit 1
            fi
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - run: pnpm imports:check

      - name: Check and pack TypeScript packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/alloy-ts-packages"
          mkdir -p "${artifact_dir}"

          packages=(
            "@alloy/console"
            "@alloy/money"
            "@alloy/navigator-routes"
            "@alloy/tempo"
            "@alloy/workflow"
          )

          for package in "${packages[@]}"; do
            package_version="$(pnpm --filter "${package}" exec node -p "require('./package.json').version")"

            if [[ "${package_version}" != "${VERSION}" ]]; then
              echo "${package} version ${package_version} does not match release version ${VERSION}" >&2
              exit 1
            fi

            pnpm --filter "${package}" typecheck
            pnpm --filter "${package}" test
            pnpm --filter "${package}" build
            pnpm --filter "${package}" pack --pack-destination "${artifact_dir}"
          done

          ls -lh "${artifact_dir}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          artifacts=("${RUNNER_TEMP}/alloy-ts-packages"/*.tgz)

          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "no TypeScript package artifacts were generated" >&2
            exit 1
          fi

          args=(
            "${TAG}"
            "${artifacts[@]}"
            --title "TypeScript ${VERSION}"
            --notes "TypeScript package release ${VERSION}."
          )

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            args+=(--target "${GITHUB_SHA}")
          fi

          gh release create "${args[@]}"
