name: TypeScript Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.1.
        required: true
        type: string
  push:
    tags:
      - ts/v*

permissions:
  contents: write

concurrency:
  group: release-ts-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_NAMESPACE: ts
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: bash infra/scripts/tasks/resolve-release-tag.sh

      - run: pnpm imports:check

      - name: Check and pack TypeScript packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: bash infra/scripts/tasks/check-pack-ts-packages.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          artifacts=("${RUNNER_TEMP}/alloy-ts-packages"/*.tgz)

          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "no TypeScript package artifacts were generated" >&2
            exit 1
          fi

          args=(
            "${TAG}"
            "${artifacts[@]}"
            --title "TypeScript ${VERSION}"
            --notes "TypeScript package release ${VERSION}."
          )

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            args+=(--target "${GITHUB_SHA}")
          fi

          gh release create "${args[@]}"
