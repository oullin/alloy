name: Go CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          go-version: "1.26.6"

      - name: Go tests
        env:
          GO_COVERAGE_DIR: ${{ runner.temp }}/go-coverage
        run: pnpm exec vp run go:test

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          summary="${RUNNER_TEMP}/go-coverage/summary.tsv"
          {
            echo "### Go coverage"
            if [[ -f "${summary}" ]]; then
              while IFS=$'\t' read -r module total; do
                echo "- ${module}: ${total}"
              done < "${summary}"
            else
              echo "- no coverage summary produced"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage profiles
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage
          path: ${{ runner.temp }}/go-coverage
          if-no-files-found: ignore
