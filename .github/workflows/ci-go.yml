name: Go CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          go-version: "1.26.4"

      - name: Go tests
        env:
          GO_COVERAGE_DIR: ${{ runner.temp }}/go-coverage
        run: pnpm exec vp run go:test

      - name: Coverage summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Go coverage"
            for profile in "${RUNNER_TEMP}/go-coverage"/*.out; do
              [[ -f "${profile}" ]] || continue
              module="$(basename "${profile}" .out)"
              total="$(go tool cover -func="${profile}" | tail -1 | awk '{print $NF}')"
              echo "- ${module}: ${total}"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage profiles
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: ${{ runner.temp }}/go-coverage
          if-no-files-found: ignore
