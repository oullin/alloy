name: TypeScript CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check package imports
        run: pnpm imports:check

      - name: Lint
        run: pnpm exec vp lint

      - name: Typecheck
        run: pnpm exec vp check

      - name: Tests
        run: pnpm exec vp test --coverage

      - name: Coverage summary
        shell: bash
        run: |
          set -euo pipefail

          summary="infra/.cache/vitest/coverage/coverage-summary.json"
          {
            echo "### TypeScript coverage"
            if [[ -f "${summary}" ]]; then
              node -e "const t=require('./${summary}').total; for (const k of ['statements','branches','functions','lines']) console.log('- ' + k + ': ' + t[k].pct + '%')"
            else
              echo "- summary file not generated; see the test step output"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ts-coverage
          path: infra/.cache/vitest/coverage
          if-no-files-found: ignore

      - name: Build packages
        run: pnpm -r --filter './sdk/*' build
