name: TypeScript CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: pnpm imports:check
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm exec vp pack

  inertia-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSER_ARGS: --no-sandbox,--disable-dev-shm-usage
      PLAYWRIGHT_HEADED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          go-version: "1.26.4"

      - name: Configure Playwright paths
        run: |
          echo "CODEX_BROWSER_ARTIFACTS_DIR=$RUNNER_TEMP/browser-artifacts" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"

      - run: pnpm exec vp exec -F @alloy/inertia-e2e -- playwright install --with-deps chromium

      - run: pnpm test:e2e:inertia

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inertia-e2e-artifacts
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore
          retention-days: 7
