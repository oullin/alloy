name: Inertia App Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  inertia-app-tests:
    name: Inertia App Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSER_ARGS: --no-sandbox,--disable-dev-shm-usage
      PLAYWRIGHT_HEADED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          go-version: "1.26.4"

      - name: Configure Playwright paths
        run: |
          echo "CODEX_BROWSER_ARTIFACTS_DIR=$RUNNER_TEMP/browser-artifacts" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"

      - run: pnpm exec vp exec -F @alloy/inertia-demo-e2e -- playwright install --with-deps chromium

      - run: pnpm exec vp run inertia-demo:e2e:playwright

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inertia-e2e-artifacts
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore
          retention-days: 7
