# Gitleaks configuration for Alloy.
# Inherits the upstream default rule set and allowlists the fake credentials
# that legitimately live in test fixtures.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures use fake keys, TOTP seeds, and sample tokens"
paths = ['''.*_test\.go$''', '''.*\.test\.(ts|js|mjs)$''', '''.*/tests/.*''', '''web/inertia-demo/api/internal/seed/.*''']
